.brand h1 b{color:var(--sand);font-weight:700}

.months::-webkit-scrollbar{display:none}

.row2{display:flex;gap:6px;align-items:center}
.sel{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--ink);background:var(--solid);border:1px solid var(--line);

.tog{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--solid);color:var(--muted);border-radius:999px;padding:5px 11px;cursor:pointer}
.tog.on{color:var(--solid);background:var(--ink);border-color:var(--ink)}
.tog.fresh.on{background:var(--fresh);border-color:var(--fresh)}

.handle{display:none}
.scroll{overflow:auto;padding:18px 18px 24px;flex:1;overscroll-behavior:contain}
.kicker{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
h2{font-family:"Shippori Mincho B1",serif;font-size:21px;margin:4px 0 6px;line-height:1.35}
.lead{color:var(--muted);font-size:12.5px;line-height:1.7;margin:0 0 12px}
.cards{display:flex;flex-direction:column;gap:8px}

.rank{font-family:"Shippori Mincho B1",serif;font-size:18px;color:var(--sand);text-align:center}

const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const NOW=new Date().getMonth()+1;
const state={month:NOW,fish:"",sea:true,fresh:true,sel:null,cell:null};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* controls */
const mBox=document.getElementById("months");
MON.forEach(m=>{const b=document.createElement("button");b.className="chip"+(m===NOW?" now":"");b.textContent=m+"月";b.dataset.m=m;
  b.onclick=()=>{state.month=m;state.cell=null;refresh();};mBox.appendChild(b);});
const fSel=document.getElementById("fish");
const cnt=new Map();DATA.areas.forEach(a=>a.fish.forEach(f=>cnt.set(f.name,(cnt.get(f.name)||0)+1)));
[...cnt].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"ja")).forEach(([n])=>fSel.add(new Option(n,n)));
fSel.onchange=()=>{state.fish=fSel.value;refresh();};
const ks=document.getElementById("kSea"),kf=document.getElementById("kFresh");
ks.onclick=()=>{state.sea=!state.sea;refresh();};kf.onclick=()=>{state.fresh=!state.fresh;refresh();};

const lvAt=(f,m)=>f.levels?f.levels[m-1]:null;
const visible=a=>a.kind==="sea"?state.sea:state.fresh;
function score(a){
  if(state.fish){const f=a.fish.find(x=>x.name===state.fish);return f?(lvAt(f,state.month)??0):-1;}
  return a.fish.reduce((s,f)=>s+({3:2,2:1}[lvAt(f,state.month)]||0),0);
}
const tops=a=>a.fish.filter(f=>lvAt(f,state.month)===3).map(f=>f.name);
function pinColor(a,s){
  if(s<=0) return css("--lv0");
  if(state.fish) return [css("--lv0"),css("--lv1"),css("--lv2"),css("--lv3")][s];
  return s>=8?css("--lv3"):s>=4?css("--lv2"):css("--lv1");
}
let layer=L.layerGroup().addTo(map);
function drawMarkers(){
  layer.clearLayers();
  DATA.areas.filter(visible).forEach(a=>{
    const s=score(a); if(state.fish&&s<0) return;
    const size=state.fish?18+Math.max(s,0)*7:18+Math.min(s,12)*2.2;
    const lbl=state.fish?"":(tops(a).length||"");
    const ink=s>=2||(!state.fish&&s>=4)?"#fff":css("--ink");
    const cls=["pin",a.measured?"m":"",a.kind==="fresh"?"fr":"",s<=0?"dim":"",state.sel===a.id?"act":""].join(" ");
    const icon=L.divIcon({className:"",iconSize:[size,size],
      html:`<div class="${cls}" style="width:${size}px;height:${size}px;background:${pinColor(a,s)};color:${ink}">${lbl}</div>`});
    L.marker([a.lat,a.lng],{icon,riseOnHover:true}).bindTooltip(esc(a.name),{direction:"top",offset:[0,-size/2]})
      .on("click",()=>openArea(a.id,false)).addTo(layer);
  });
}

/* panel */
const panel=document.getElementById("panel");
function legend(){return `<div class="legend"><span><i class="l3"></i>最盛期</span><span><i class="l2"></i>狙えば釣れる</span><span><i class="l1"></i>混じる程度</span><span><i class="l0"></i>ほぼ釣れない</span><span><i class="lna"></i>データなし</span></div>`;}
const LVL=["","初心者向け","慣れれば簡単","経験者向け"];
function methodsView(fish,areaId){
  const loc=areaId&&(DATA.methods_local||{})[areaId];
  const local=loc&&(loc[(DATA.canon||{})[fish]||fish]||loc[fish]);
  const m=local||(DATA.methods||{})[fish];
  if(!m) return `<section class="methods"><div class="mh"><span class="kicker">${esc(fish)}のおすすめの釣り方</span></div>
    <p class="mnote">この魚の釣り方はまだ集計できていません。</p></section>`;
  const max=Math.max(...m.items.map(i=>i.share||0),.0001);
  return `<section class="methods"><div class="mh"><span class="kicker">${areaId?esc(fish)+"の":""}おすすめの釣り方</span>
      <span class="mbasis ${m.basis}">${local?"この釣り場の実績順":m.basis==="data"?(areaId?"関西全体の実績順":"実績順"):"定番順"}</span></div>
    <ol class="mlist">${m.items.map((it,i)=>`<li>
      <span class="mr">${i+1}</span>
      <div class="mb"><div class="mt"><b>${esc(it.method)}</b>${it.level?`<span class="dots" title="${LVL[it.level]}">${"●".repeat(it.level)}${"○".repeat(3-it.level)}<em>${LVL[it.level]}</em></span>`:""}</div>
        ${it.share!=null?`<div class="bar"><i style="width:${it.share/max*100}%"></i><span>${Math.round(it.share*100)}%</span></div>`:""}
        ${it.tip?`<div class="tip2">${esc(it.tip)}</div>`:""}</div></li>`).join("")}</ol>
    ${m.extra&&m.extra.length?`<div class="mextra">ほかの定番：${m.extra.map(esc).join("・")}</div>`:""}
    <p class="mnote">${m.basis==="data"
      ?`釣果情報に書かれた釣り方 ${m.total}件の割合です（${m.sources.map(esc).join("・")}）。施設や店の得意な釣り方に引っぱられるので、目安として見てください。`
      :`集計できた実績が少ないため（${m.total}件）、一般的な定番の順に並べています。`}</p></section>`;
}
function listView(){
  const rows=DATA.areas.filter(visible).map(a=>({a,s:score(a)})).filter(o=>o.s>0).sort((p,q)=>q.s-p.s).slice(0,20);
  const max=Math.max(1,...rows.map(o=>o.s));
  panel.innerHTML=`<div class="kicker">${state.month}月の釣り場</div>
    <h2>${state.fish?esc(state.fish)+"が釣れるエリア":"いま釣れているエリア"}</h2>
    <p class="lead">円の大きさと濃さが釣れ具合です。金の縁取りは海釣り施設の公式釣果を集計した「実測」、それ以外は記事や釣具店情報からの推定です。</p>
    ${state.fish?methodsView(state.fish):""}
    ${state.fish?'<div class="kicker" style="margin-top:18px">釣れるエリア</div>':""}
    ${legend()}
    <div class="cards">${rows.length?rows.map((o,i)=>{
      const t=state.fish?[]:tops(o.a);

        <div><div class="nm">${esc(o.a.name)}</div><div class="pf">${o.a.pref}・${o.a.kind==="sea"?"海":"淡水"}${o.a.measured?"・実測":""}</div>
        ${t.length?`<div class="fchips">${t.slice(0,6).map(n=>`<span class="fchip t">${esc(n)}</span>`).join("")}</div>`:""}</div>
        <div>${state.fish?`<span class="fchip ${o.s===3?"t":""}">${LV[o.s]}</span>`:`<div class="meter"><i style="width:${o.s/max*100}%"></i></div>`}</div></div>`}).join("")

    <p class="foot">ランクは天気予報の降水確率に近い考え方です。実測エリアでは「その月に施設の釣果表へ載った日の割合」を使い、60%なら10日のうち6日は誰かが釣っている、という意味になります。立入禁止・遊漁券・禁漁期は年ごとに変わるので、釣行前に現地の掲示を見ておくと安心です。<br>データ作成日 ${DATA.generated}</p>`;
  panel.querySelectorAll(".card").forEach(c=>c.onclick=()=>openArea(c.dataset.id,true));
}
function cellText(f,m){
  const v=lvAt(f,m);
  let t=`<b>${esc(f.name)}・${m}月</b>　${v==null?"データなし":LV[v]}`;
  if(f.basis==="measured"){const c=f.cells[m-1];
    if(c.days) t+=`<br>記録 ${c.days}日のうち ${c.hit}日に記載（${Math.round(c.rate*100)}%）`;
    if(c.median) t+=`<br>釣れた日の施設合計の中央値 ${c.median}匹`;
    if(c.per_angler) t+=`<br>来場者1人あたり ${c.per_angler.toFixed(2)}匹`;
  }else if(f.basis==="qual") t+=`<br>記事・釣具店情報の時期記述からの推定`;
  else t+=`<br>釣具店に寄せられた釣果報告のみ`;
  if(f.reports&&f.reports[m-1]) t+=`<br>釣具店の釣果報告 ${f.reports[m-1]}件（陸っぱり）`;
  return t;
}

  document.getElementById("back").onclick=()=>{state.sel=null;refresh();};
  // タップした行の直下に詳細行を差し込む（同じ行をもう一度タップで閉じる）
  let open=null;
  const show=(i,m)=>{
    panel.querySelectorAll("td.sel").forEach(x=>x.classList.remove("sel"));

function openArea(id,pan){
  state.sel=id;const a=DATA.areas.find(x=>x.id===id);
  if(isMobile()) setSheet(window.innerHeight*.62);
  if(pan||isMobile()) flyVisible([a.lat,a.lng],Math.max(map.getZoom(),9));
  refresh();panel.parentElement.scrollTop=0;panel.scrollTop=0;
}
function refresh(){
  mBox.querySelectorAll(".chip").forEach(b=>b.classList.toggle("on",+b.dataset.m===state.month));
  ks.classList.toggle("on",state.sea);kf.classList.toggle("on",state.fresh);
  drawMarkers();
  const a=DATA.areas.find(x=>x.id===state.sel);
  a?areaView(a):listView();
}

/* mobile bottom sheet */
const sheet=document.getElementById("sheet"),handle=document.getElementById("handle");
const isMobile=()=>matchMedia("(max-width: 760px)").matches;
function setSheet(h){
  const min=96,max=window.innerHeight-150;h=Math.max(min,Math.min(max,h));
  document.documentElement.style.setProperty("--sheet-h",h+"px");
}
let drag=null;
handle.addEventListener("pointerdown",e=>{drag={y:e.clientY,h:sheet.getBoundingClientRect().height};sheet.classList.add("dragging");handle.setPointerCapture(e.pointerId);});
handle.addEventListener("pointermove",e=>{if(drag) setSheet(drag.h+(drag.y-e.clientY));});
handle.addEventListener("pointerup",e=>{
  if(!drag) return;sheet.classList.remove("dragging");
  const h=sheet.getBoundingClientRect().height,H=window.innerHeight;
  if(Math.abs(e.clientY-drag.y)<6){setSheet(h<H*.5?H*.75:H*.42);}
  else{const snaps=[96,H*.42,H*.8];setSheet(snaps.reduce((p,c)=>Math.abs(c-h)<Math.abs(p-h)?c:p));}
  drag=null;});

// パネル・シートに隠れない位置に地点を出す
function overlayPad(){
  const top=document.querySelector(".top").getBoundingClientRect().bottom+10;
  // シートは高さアニメーション中なので、実寸ではなく目標の高さを使う
  const sh=parseFloat(document.documentElement.style.getPropertyValue("--sheet-h"))||window.innerHeight*.42;
  if(isMobile()) return {tl:[10,top],br:[10,sh+10]};
  return {tl:[60,top],br:[sheet.getBoundingClientRect().width+40,20]};
}
function flyVisible(ll,z){
  const p=overlayPad(),s=map.getSize();
  const cx=(p.tl[0]+s.x-p.br[0])/2, cy=(p.tl[1]+s.y-p.br[1])/2;
  const pt=map.project(ll,z).subtract([cx-s.x/2,cy-s.y/2]);
  map.flyTo(map.unproject(pt,z),z,{duration:.6});
}
function fitAll(){
  const p=overlayPad();
  map.fitBounds(L.latLngBounds(DATA.areas.map(a=>[a.lat,a.lng])),{paddingTopLeft:p.tl,paddingBottomRight:p.br});
}
const nowChip=mBox.querySelector(`[data-m="${NOW}"]`);
mBox.scrollLeft=nowChip.offsetLeft-mBox.clientWidth/2+nowChip.offsetWidth/2;
refresh();
fitAll();
</script>
